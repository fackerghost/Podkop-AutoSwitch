name: OpenWrt packages
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native test dependencies
        timeout-minutes: 3
        run: |
          cmake --version
          busybox --help >/dev/null
          jq --version
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y libjson-c-dev
      - run: sh tests/ci-native-tools.sh
      - run: busybox ash tests/reconcile-regression.sh
      - run: node --check package/podkop-autoswitch/files/www/luci-static/resources/view/podkop-autoswitch/main.js
      - run: node --check package/podkop-autoswitch/files/www/autoswitch/panel.js
  ipk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_ipk.py
      - run: node --check package/podkop-autoswitch/files/www/luci-static/resources/view/podkop-autoswitch/main.js
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*.ipk
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: aarch64_cortex-a53-25.12.0
          FEED_DIR: ${{ github.workspace }}/package
          PACKAGES: podkop-autoswitch
          NO_DEFAULT_FEEDS: 1
          NO_SHFMT_CHECK: 1
          V: s
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/packages/**/*.apk
          if-no-files-found: error
  release-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [regression, ipk, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'podkop-autoswitch*.ipk' -o -name 'podkop-autoswitch*.apk' \) -exec cp '{}' release/ \;
          cp install.sh uninstall.sh release/
          cd release
          sha256sum *.ipk *.apk install.sh uninstall.sh > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" ./* --clobber --repo "$GITHUB_REPOSITORY"
